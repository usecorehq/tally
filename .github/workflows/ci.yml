name: ci

on:
  pull_request:
  push:
    branches: [staging]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: bash scripts/check-secrets.sh --tree
      - name: Scan this PR's changes
        if: github.event_name == 'pull_request'
        run: bash scripts/check-secrets.sh --range "origin/${{ github.base_ref }}...HEAD"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # schema.ts must match packages/db/migrations (offline, no database).
      - run: pnpm db:check
      - run: pnpm build

  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/train
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Catches Gradle/flavor config errors that analyze and test never see.
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
