name: ci

# secrets always runs. web / train / mobile run only when their code changed,
# or when started by hand: Actions → ci → Run workflow (pick the jobs), or
#   gh workflow run ci.yml --ref <branch> -f web=true -f train=true -f mobile=true
on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      web:
        description: "web: typecheck, test, db:check, build"
        type: boolean
        default: true
      train:
        description: "train: ruff + pytest"
        type: boolean
        default: false
      mobile:
        description: "mobile: analyze, test, dev APK (~5 min)"
        type: boolean
        default: false

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      train: ${{ steps.filter.outputs.train }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/api/**'
              - 'apps/mp/**'
              - 'apps/console/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'scripts/check-db-drift.sh'
              - '.github/workflows/**'
            train:
              - 'services/train/**'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/**'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files
        run: bash scripts/check-secrets.sh --tree
      - name: Scan this PR's changes
        if: github.event_name == 'pull_request'
        run: bash scripts/check-secrets.sh --range "origin/${{ github.base_ref }}...HEAD"

  web:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.web || github.event_name != 'workflow_dispatch' && needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # schema.ts must match packages/db/migrations (offline, no database).
      - run: pnpm db:check
      - run: pnpm build

  train:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.train || github.event_name != 'workflow_dispatch' && needs.changes.outputs.train == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/train
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  mobile:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && inputs.mobile || github.event_name != 'workflow_dispatch' && needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Catches Gradle/flavor config errors that analyze and test never see.
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
