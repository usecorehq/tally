name: qore_tally
description: Tally — inventory and sales for Qorelly merchants.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Functional error handling — every repository returns Either<Failure, T>
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^8.0.3

  # Flavors (dev / staging / prod) — see README
  flutter_flavor: ^3.1.4

  # Shared Qorelly auth (same Supabase project) + tally API
  supabase_flutter: ^2.9.0
  dio: ^5.8.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
