[project]
name = "tally-train"
version = "0.1.0"
description = "Q Vision distillation — trains image models against the Qore Catalog API."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/train"]

[tool.ruff]
line-length = 100
